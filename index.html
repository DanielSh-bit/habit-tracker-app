<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LevelUp</title>
  <meta name="apple-mobile-web-app-title" content="LevelUp">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#111827">
</head>
<body>
  <div class="intro-overlay hidden" id="introOverlay">
    <video id="introVideo" muted playsinline preload="auto">
      <source src="intro.mp4" type="video/mp4">
    </video>

    <div class="intro-result" id="introResult">
      <div class="intro-label">ימי התמדה</div>
      <strong id="introStreakNumber">0</strong>
    </div>
  </div>

  <main class="app">

    <section class="screen active" id="homeScreen">

      <header class="home-header">
        <div class="brand">
          <h1>LevelUp</h1>
          <p>Home Screen</p>
        </div>
      
        <div class="home-progress-ring" id="homeProgressRing" aria-label="Daily progress">
          <svg class="progress-ring-svg" viewBox="0 0 120 120">
            <circle class="progress-ring-track" cx="60" cy="60" r="44"></circle>
            <circle class="progress-ring-fill" id="progressRingFill" cx="60" cy="60" r="44"></circle>
          </svg>
      
          <div class="progress-ring-center">
            <strong id="progressPercentValue">0%</strong>
          </div>
        </div>
      
        <button class="menu-button" id="openMenuButton" type="button" aria-label="פתח תפריט">
          ☰
        </button>
      </header>

      <section class="goals-grid" id="goalsGrid"></section>
    </section>

    <div class="menu-overlay" id="menuOverlay"></div>

    <aside class="side-menu" id="sideMenu">
      <nav class="side-menu-options">
        <button id="openRankingFromMenu">דירוג</button>
        <button type="button" id="openDailyCalendarFromMenu">
          לוח שנה
        </button>
        <button type="button" id="openProfileFromMenu">
          פרופיל
        </button>
        <button id="openAddFromMenu">הוספת אתגר</button>
        <button id="openRenameFromMenu">שינוי שם</button>
        <button id="openAdminFromMenu">ניהול</button>
        <button id="enableNotificationsFromMenu">אפשר התראות</button>
      </nav>
    </aside>

    <div class="menu-overlay" id="goalOptionsOverlay"></div>

    <aside class="side-menu" id="goalOptionsMenu">
      <nav class="side-menu-options">
        <button id="openGoalEditFromMenu">עריכת האתגר</button>
        <button id="openGoalInfoFromMenu">מידע</button>
      </nav>
    </aside>

    <div class="confirm-overlay" id="deleteConfirmOverlay">
      <section class="confirm-box">
        <h2>Delete this challenge?</h2>

        <div class="confirm-actions">
          <button type="button" id="cancelDeleteButton">No</button>
          <button type="button" id="confirmDeleteButton">Yes</button>
        </div>
      </section>
    </div>

    <div class="day-detail-overlay" id="dayDetailOverlay">
      <section class="day-detail-box" id="dayDetailBox">
        <strong id="dayDetailScore"></strong>
      </section>
    </div>

    <section class="screen" id="addScreen">
      <button class="back-button" data-target="homeScreen">←</button>

      <h1 class="screen-title add-screen-title">אתגר חדש</h1>

      <form class="add-goal-form" id="addGoalForm" novalidate>
        <div class="form-card add-goal-card">

          <label class="field-block">
            <span>שם האתגר</span>
            <input
              type="text"
              id="goalNameInput"
              class="clean-input"
              maxlength="22"
            >
          </label>

          <label class="field-block">
            <span>תיאור</span>
            <textarea
              id="goalDescriptionInput"
              class="clean-textarea"
              maxlength="120"
              rows="3"
            ></textarea>
          </label>

          <label class="field-block">
            <span>חשיבות</span>
            <input
              type="number"
              id="goalImportanceInput"
              class="clean-input"
              min="1"
              max="5"
              step="1"
              inputmode="numeric"
              value="3"
            >
          </label>

          <div class="field-block">
            <span>סוג האתגר</span>

            <input type="hidden" id="goalTypeInput">

            <div class="custom-select" id="goalTypePicker">
              <button type="button" class="custom-select-button" id="goalTypeButton"></button>

              <div class="custom-options" id="goalTypeOptions">
                <button type="button" data-value="yesno">כן / לא</button>
                <button type="button" data-value="counter">מספר</button>
              </div>
            </div>
          </div>

          <div class="target-wrapper hidden" id="goalTargetWrapper">
            <label class="field-block">
              <span>יעד</span>
              <input
                type="number"
                id="goalTargetInput"
                class="clean-input"
                min="2"
                max="999"
                step="1"
                inputmode="numeric"
              >
            </label>
          </div>

          <div class="field-block schedule-field">
            <span>ימים פעילים</span>

            <div class="weekday-picker" id="goalSchedulePicker">
              <button type="button" data-day="0" class="active">S</button>
              <button type="button" data-day="1" class="active">M</button>
              <button type="button" data-day="2" class="active">T</button>
              <button type="button" data-day="3" class="active">W</button>
              <button type="button" data-day="4" class="active">T</button>
              <button type="button" data-day="5" class="active">F</button>
              <button type="button" data-day="6" class="active">S</button>
            </div>
          </div>
          
        </div>

        <button type="submit" class="create-button">create</button>
      </form>
    </section>

    <section class="screen goal-screen" id="goalScreen">
      <button class="back-button" data-target="homeScreen">←</button>
      <button class="goal-screen-options-button" id="openGoalOptionsButton">⋮</button>
      <div class="goal-details-wrapper" id="goalDetails"></div>
    </section>

    <section class="screen" id="goalSettingsScreen">
      <button class="back-button" data-target="goalScreen">←</button>

      <h1 class="screen-title add-screen-title">עריכת אתגר</h1>

      <form class="add-goal-form edit-goal-form" id="editGoalForm" novalidate>
        <div class="form-card add-goal-card edit-goal-card">

          <label class="field-block">
            <span>שם האתגר</span>
            <input
              type="text"
              id="editGoalNameInput"
              class="clean-input"
              maxlength="22"
            >
          </label>

          <label class="field-block">
            <span>תיאור</span>
            <textarea
              id="editGoalDescriptionInput"
              class="clean-textarea"
              maxlength="120"
              rows="3"
            ></textarea>
          </label>

          <label class="field-block">
            <span>חשיבות</span>
            <input
              type="number"
              id="editGoalImportanceInput"
              class="clean-input"
              min="1"
              max="5"
              step="1"
              inputmode="numeric"
            >
          </label>

          <div class="field-block">
            <span>סוג האתגר</span>

            <input type="hidden" id="editGoalTypeInput">

            <div class="custom-select" id="editGoalTypePicker">
              <button type="button" class="custom-select-button" id="editGoalTypeButton"></button>

              <div class="custom-options" id="editGoalTypeOptions">
                <button type="button" data-value="yesno">כן / לא</button>
                <button type="button" data-value="counter">מספר</button>
              </div>
            </div>
          </div>

          <div class="target-wrapper hidden" id="editGoalTargetWrapper">
            <label class="field-block">
              <span>יעד</span>
              <input
                type="number"
                id="editGoalTargetInput"
                class="clean-input"
                min="2"
                max="999"
                step="1"
                inputmode="numeric"
              >
            </label>
          </div>
          
          <div class="field-block schedule-field">
            <span>ימים פעילים</span>

            <div class="weekday-picker" id="editGoalSchedulePicker">
              <button type="button" data-day="0" class="active">S</button>
              <button type="button" data-day="1" class="active">M</button>
              <button type="button" data-day="2" class="active">T</button>
              <button type="button" data-day="3" class="active">W</button>
              <button type="button" data-day="4" class="active">T</button>
              <button type="button" data-day="5" class="active">F</button>
              <button type="button" data-day="6" class="active">S</button>
            </div>
          </div>
          
        </div>

        <button type="submit" class="create-button save-button">save</button>
      </form>

      <button type="button" class="trash-button" id="deleteGoalButton">🗑</button>
    </section>

    <section class="screen" id="goalInfoScreen">
      <button class="back-button" data-target="goalScreen">←</button>

      <header class="goal-info-header">
        <h1 id="goalInfoTitle">מידע</h1>

        <div class="calendar-nav">
          <button type="button" id="prevMonthButton">‹</button>
          <strong id="calendarMonthTitle"></strong>
          <button type="button" id="nextMonthButton">›</button>
        </div>
      </header>

      <section class="form-card info-card">
        <div class="calendar-grid" id="goalCalendarGrid"></div>
      </section>
    </section>

    <section class="screen" id="dailyCalendarScreen">
      <div class="daily-calendar-screen">
        <button type="button" class="daily-calendar-back-button" id="dailyCalendarBackButton" aria-label="חזרה לבית">
          ←
        </button>
    
        <header class="daily-calendar-title">
          <h1>לוח שנה</h1>
        </header>
    
        <section class="daily-calendar-month-card">
          <button type="button" id="dailyPrevMonthButton">‹</button>
    
          <h2 id="dailyCalendarMonthTitle"></h2>
    
          <button type="button" id="dailyNextMonthButton">›</button>
        </section>
    
        <section class="daily-calendar-card">
          <div class="calendar-grid" id="dailyCalendarGrid"></div>
        </section>
      </div>
    
      <div class="daily-day-overlay" id="dailyDayOverlay">
        <article class="daily-day-modal" id="dailyDayModal"></article>
      </div>
    </section>
    
    <section class="screen ranking-screen" id="rankingScreen">
      <button class="back-button" data-target="homeScreen">←</button>

      <header class="ranking-header">
        <h1>דירוג</h1>
        <button id="toggleRankingSortButton">נוכחי</button>
      </header>

      <section class="ranking-list" id="rankingList"></section>
    </section>

    <section class="screen" id="adminScreen">
  <button class="back-button" data-target="homeScreen">←</button>

  <h1 class="screen-title add-screen-title">ניהול</h1>

  <section class="form-card" id="adminLoginBox">
    <form id="adminLoginForm" novalidate>
      <label>
        סיסמת מנהל
        <input
          type="password"
          id="adminPasswordInput"
          maxlength="32"
          required
        >
      </label>

      <button type="submit">כניסה</button>
    </form>
  </section>

  <section class="admin-panel hidden" id="adminPanel">
    <section class="form-card">
      <h2 class="admin-section-title">שינוי סיסמה</h2>

      <form id="adminPasswordForm" novalidate>
        <label>
          סיסמה חדשה
          <input
            type="password"
            id="newAdminPasswordInput"
            maxlength="32"
            required
          >
        </label>

        <button type="submit">save</button>
      </form>
    </section>

    <section class="form-card">
      <h2 class="admin-section-title">משתמשים</h2>

      <div class="admin-users-list" id="adminUsersList"></div>
    </section>
  </section>
</section>
    
    <section class="screen" id="renameScreen">
      <button class="back-button" data-target="homeScreen">←</button>

      <h1 class="screen-title add-screen-title">שינוי שם</h1>

      <form class="form-card" id="renameForm" novalidate>
        <label>
          שם
          <input type="text" id="renameNameInput" maxlength="16" required>
        </label>

        <button type="submit">save</button>
      </form>
    </section>

    <section class="screen" id="nameScreen">
      <div class="welcome-header">
        <div class="welcome-icon">😊</div>
        <h1 class="screen-title welcome-title">ברוך הבא</h1>
      </div>

      <form class="form-card" id="nameForm" novalidate>
        <label>
          שם
          <input type="text" id="playerNameInput" maxlength="16" required>
        </label>

        <button type="submit">המשך</button>
      </form>
    </section>

    <section class="screen" id="goalGalleryScreen">
      <div class="goal-gallery-screen">

        <button type="button" class="goal-gallery-back-button" id="goalGalleryBackButton" aria-label="חזרה">
          ←
        </button>
        
        <header class="goal-gallery-header">
          <h1 id="goalGalleryTitle">גלריה</h1>
          <p id="goalGalleryCounter">0/0</p>
        </header>
  
        <div class="goal-gallery-stage" id="goalGalleryStage">
          <div class="goal-gallery-empty">אין עדיין תמונות</div>
        </div>

        <div class="goal-gallery-nav">
          <button type="button" id="galleryPrevButton">‹</button>
          <button type="button" id="galleryNextButton">›</button>
        </div>
      </div>
    </section>

    <section class="screen" id="profileScreen">
      <div class="profile-screen">
        <button type="button" class="profile-back-button" id="profileBackButton" aria-label="חזרה לבית">
          ←
        </button>
    
        <div class="profile-money-pill" id="profileMoneyPill">
          💰 <span id="profileCoinsValue">0</span>
        </div>
    
        <header class="profile-header">
          <h1>Profile</h1>
        </header>
    
        <section class="profile-avatar-card">
          <div class="profile-avatar-circle" id="profileAvatarCircle">
            🪱
          </div>
    
          <div class="profile-level-text">
            Level <strong id="profileLevelValue">1</strong>
          </div>
    
          <div class="profile-level-progress">
            <div class="profile-level-progress-fill" id="profileLevelProgressFill"></div>
          </div>
    
          <p class="profile-next-level-text" id="profileNextLevelText"></p>
        </section>
    
        <section class="profile-name-preview-card">
          <div class="profile-name-preview" id="profileNamePreview">
            משתמש
          </div>
        </section>
    
        <section class="profile-actions">
          <button type="button" id="openAvatarCollectionButton">
            Avatars
          </button>
    
          <button type="button" id="openNameStylesButton">
            Name Styles
          </button>
        </section>
      </div>
    </section>
    
  </main>

  <nav class="bottom-tab-bar bottom-tab-bar-4" id="bottomTabBar">
    <button type="button" class="bottom-tab-button" id="bottomGoalsTab">
      <span class="bottom-tab-icon">🎯</span>
      <span>goal</span>
    </button>
  
    <button type="button" class="bottom-tab-button" id="bottomProfileTab">
      <span class="bottom-tab-icon">👤</span>
      <span>Profile</span>
    </button>
  
    <button type="button" class="bottom-tab-button" id="bottomScoresTab">
      <span class="bottom-tab-icon">🏆</span>
      <span>Scores</span>
    </button>
  
    <button type="button" class="bottom-tab-button" id="bottomCalendarTab">
      <span class="bottom-tab-icon">📅</span>
      <span>Calendar</span>
    </button>
  </nav>
  
  <script src="script.js"></script>
</body>
</html>
